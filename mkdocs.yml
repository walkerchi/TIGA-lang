site_name: GraphForge Compiler
site_description: Relation-oriented compilation for sparse, dense, and generated graph computations
site_url: https://graphforge-docs.app.walkerchi.com/
repo_url: https://github.com/walkerchi/graphforge
repo_name: walkerchi/graphforge
copyright: Copyright &copy; 2026 GraphForge contributors
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  logo: assets/graphforge-mark.svg
  favicon: assets/graphforge-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences
plugins:
  - search
extra_css:
  - stylesheets/graphforge.css
extra_javascript:
  - javascripts/graphforge.js
extra:
  generator: false
nav:
  - Overview: index.md
  - Guide:
      - Start here: getting-started.md
      - Programming model: programming-model.md
      - Examples: examples.md
  - Compiler:
      - Pipeline and IR: compiler-pipeline.md
      - Dynamic relations: dynamic-graphs.md
      - Linear solvers and implicit VJP: linear-solvers.md
      - Tensor runtime & autograd: runtime-and-autograd.md
      - Memory & distributed: memory-and-distributed.md
  - Performance:
      - Measured results: benchmark-results.md
      - Methodology and reproduction: performance.md
  - Reference:
      - Python API: api.md
      - Current status & roadmap: roadmap.md
      - Development: development.md
  - Design notes:
      - Design notes index: design-notes.md
      - Architecture RFC: rfcs/0001-architecture.md
      - IR implementation notes: IR_DESIGN.md
      - Related work: RELATED_WORK.md
      - Benchmark protocol: BENCHMARKS.md
      - Scheduling abstractions: SCHEDULING_ABSTRACTIONS.md
      - GPU graph optimization: GPU_GRAPH_OPTIMIZATION.md
      - Compiler bootstrap: COMPILER_BOOTSTRAP.md
