site_name: Tiga Compiler
site_description: Tiga compiles differentiable graph message passing with PyTorch tensors for sparse aggregation and GPU graph computation.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://walkerchi.github.io/TIGA-lang/']
repo_url: https://github.com/walkerchi/TIGA-lang
repo_name: walkerchi/TIGA-lang
copyright: Copyright &copy; 2026 Tiga contributors
docs_dir: docs
site_dir: site
hooks:
  - docs/hooks/api_navigation.py
  - docs/hooks/mlir_highlight.py
  - docs/hooks/search_metadata.py
validation:
  links:
    anchors: warn
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  logo: assets/tiga-mark.svg
  favicon: assets/tiga-mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 简体中文
          site_name: Tiga 编译器
          site_description: Tiga 使用 PyTorch Tensor 编译可微 graph message passing，支持稀疏聚合与 GPU 图计算。
          nav_translations:
            Overview: 概览
            User guide: 使用指南
            Execution and troubleshooting: 执行与排错
            Memory and storage: 内存与存储
            Runnable API examples: 可运行 API 例子
            Reproduce the charts: 复现图表
            Compiler development: 编译器开发
            Compiler introduction: 编译器入门
            IR by example: 用实例读懂 IR
            Build and contribute: 构建与贡献
            Start here: 快速上手
            Programming model: 编程模型
            PyTorch sparse and graph networks: PyTorch 稀疏运算与图神经网络
            Message passing: 消息传递
            Reducers: Reducer
            How Tiga compares: 对比与定位
            Examples: 示例
            Visualization: 可视化
            Attention and dense relations: 注意力与稠密关系
            Message passing and graph algorithms: 消息传递与图算法
            Dynamic and generated relations: 动态与生成式关系
            Linear solvers and control flow: 线性求解器与控制流
            Tensor kernels, programs and Torch interop: Tensor kernel、程序与 Torch 互操作
            Distributed and memory hierarchy: 分布式与内存层级
            Compiler: 编译器
            Pipeline and IR: 流水线与 IR
            Dynamic relations: 动态关系
            Linear solvers and implicit VJP: 线性求解器与隐式 VJP
            Tensor runtime & autograd: Tensor 运行时与自动微分
            Memory & distributed: 内存与分布式
            Benchmark: 基准测试
            Measured results: 实测结果
            Performance and scalability: 性能与扩展性
            Benchmark suite: 基准套件
            Methodology and protocol: 方法论与协议
            Reference: 参考
            Troubleshooting and reporting bugs: 排错与问题反馈
            Python API: Python API
            Current status & roadmap: 当前状态与路线图
            Development: 开发
extra_css:
  - stylesheets/tiga.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/tiga.js
extra:
  generator: false
  google_site_verification: !ENV [GOOGLE_SITE_VERIFICATION, '']
nav:
  - Overview: index.md
  - User guide:
      - Start here: getting-started.md
      - Programming model: programming-model.md
      - PyTorch sparse and graph networks: pytorch-sparse-message-passing.md
      - Message passing: message-passing.md
      - Reducers: reducers.md
      - Execution and troubleshooting: execution.md
      - Memory and storage: memory.md
  - Examples:
      - examples.md
      - Message passing and graph algorithms: examples/message-passing.md
      - Dynamic and generated relations: examples/dynamic-relations.md
      - Distributed and memory hierarchy: examples/distributed-memory.md
      - Tensor kernels, programs and Torch interop: examples/programs-and-interop.md
      - Visualization: examples/visualization.md
      - Linear solvers and control flow: examples/solvers.md
      - Attention and dense relations: examples/attention.md
  - Compiler development:
      - Compiler introduction: compiler-pipeline.md
      - IR by example: ir-walkthrough.md
      - Build and contribute: development.md
      - Dynamic relations: dynamic-graphs.md
      - Linear solvers and implicit VJP: linear-solvers.md
      - Tensor runtime & autograd: runtime-and-autograd.md
      - Memory & distributed: memory-and-distributed.md
  - Benchmark:
      - Performance and scalability: experiments.md
      - Measured results: benchmark-results.md
      - Reproduce the charts: benchmark-reproducibility.md
      - Benchmark suite: benchmark-suite.md
      - Methodology and protocol: performance.md
  - Reference:
      - Python API: api.md
      - Runnable API examples: api-examples.md
      - Troubleshooting and reporting bugs: support.md
      - Current status & roadmap: roadmap.md
      - How Tiga compares: comparison.md
exclude_docs: |
  includes/**
  archive/**
  design-notes.md
  IR_DESIGN.md
  RELATED_WORK.md
  SCHEDULING_ABSTRACTIONS.md
  GPU_GRAPH_OPTIMIZATION.md
  rfcs/**
