name: compiler-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: 22.1.8
  LLVM_ARCHIVE_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384

jobs:
  linux-llvm-mlir:
    name: LLVM/MLIR 22.1.8 clean build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-venv xz-utils

      - name: Cache pinned LLVM SDK
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/graphforge-llvm-22.1.8
          key: llvm-22.1.8-linux-x64-df0e1ecf

      - name: Fetch and verify pinned LLVM SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          curl --fail --location --retry 5 --output "$archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          echo "${LLVM_ARCHIVE_SHA256}  $archive" | sha256sum --check
          mkdir -p "${RUNNER_TOOL_CACHE}/graphforge-llvm-${LLVM_VERSION}"
          tar -xJf "$archive" --strip-components=1 \
            -C "${RUNNER_TOOL_CACHE}/graphforge-llvm-${LLVM_VERSION}"

      - name: Configure clean compiler build
        shell: bash
        run: |
          set -euxo pipefail
          sdk="${RUNNER_TOOL_CACHE}/graphforge-llvm-${LLVM_VERSION}"
          test_tools="$RUNNER_TEMP/llvm-test-tools"
          python3 tools/bootstrap_llvm_test_tools.py \
            --llvm-root "$sdk" --output "$test_tools"
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLIR_DIR="$sdk/lib/cmake/mlir" \
            -DLLVM_DIR="$sdk/lib/cmake/llvm" \
            -DLLVM_EXTERNAL_LIT="$test_tools/lit/lit.py" \
            -DGRAPHFORGE_LLVM_TEST_TOOLS_DIR="$test_tools/bin" \
            -DGRAPHFORGE_STRICT_LLVM_VERSION=ON \
            -DGRAPHFORGE_BUNDLE_LLVM_RUNTIME=ON \
            -DPython3_EXECUTABLE="$(command -v python3)"

      - name: Build and run MLIR regression suite
        run: cmake --build build/ci --target check-graphforge --parallel 2

      - name: Build wheel from the pinned SDK
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/pip" install --upgrade \
            pip build twine auditwheel mkdocs-material
          sdk="${RUNNER_TOOL_CACHE}/graphforge-llvm-${LLVM_VERSION}"
          CMAKE_ARGS="-DMLIR_DIR=$sdk/lib/cmake/mlir -DLLVM_DIR=$sdk/lib/cmake/llvm -DGRAPHFORGE_STRICT_LLVM_VERSION=ON" \
            "$RUNNER_TEMP/build-venv/bin/python" -m build --wheel
          "$RUNNER_TEMP/build-venv/bin/python" -m twine check --strict dist/*.whl
          "$RUNNER_TEMP/build-venv/bin/python" -m auditwheel repair \
            --plat manylinux_2_38_x86_64 --wheel-dir wheelhouse dist/*.whl

      - name: Build strict documentation
        run: |
          "$RUNNER_TEMP/build-venv/bin/mkdocs" build --strict

      - name: Smoke-test wheel without Torch or an LLVM installation
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/pip" install --no-deps wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/python" \
            "$GITHUB_WORKSPACE/tests/smoke/wheel_without_torch.py"

      - name: Reclaim native build space before Python tests
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/build/ci" "$GITHUB_WORKSPACE/dist"

      - name: Run Torch-free compiler/runtime tests
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/pip" install \
            pytest numpy pillow
          "$RUNNER_TEMP/test-venv/bin/pip" install --no-deps wheelhouse/*.whl
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/test-venv/bin/python" -m pytest -q \
              "$GITHUB_WORKSPACE/tests/python/test_large_graph_suite.py" \
              "$GITHUB_WORKSPACE/tests/python/test_output_layout.py" \
              "$GITHUB_WORKSPACE/tests/python/test_perf_protocol.py" \
              "$GITHUB_WORKSPACE/tests/python/test_plot_benchmarks.py" \
              "$GITHUB_WORKSPACE/tests/python/test_project_boundaries.py" \
              "$GITHUB_WORKSPACE/tests/python/test_provider_registry.py" \
              "$GITHUB_WORKSPACE/tests/python/test_symbolic_shapes.py"

      - uses: actions/upload-artifact@v4
        with:
          name: graphforge-linux-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error

  torch-compatibility:
    name: Optional Torch adapter and full CPU suite
    needs: linux-llvm-mlir
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: graphforge-linux-wheel
          path: wheelhouse
      - name: Install wheel, tests, and optional CPU Torch adapter
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install pytest numpy pillow
          python -m pip install torch \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps wheelhouse/*.whl
      - name: Run installed-wheel CPU Python suite
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          python -m pytest -q "$GITHUB_WORKSPACE/tests/python"
