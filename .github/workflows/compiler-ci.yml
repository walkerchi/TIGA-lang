name: compiler-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  LLVM_VERSION: 22.1.8
  LLVM_ARCHIVE_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384

jobs:
  linux-llvm-mlir:
    name: LLVM/MLIR 22.1.8 wheel and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - name: Reserve disk space for LLVM
        # These are unused preinstalled SDKs on an ephemeral GitHub-hosted VM.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build python3-venv xz-utils
          echo "CCACHE_DIR=$RUNNER_TEMP/tiga-ccache" >> "$GITHUB_ENV"

      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tiga-ccache
          key: native-v1-ubuntu24.04-llvm22.1.8-py3.12-${{ github.sha }}
          restore-keys: native-v1-ubuntu24.04-llvm22.1.8-py3.12-

      - name: Cache pinned LLVM SDK
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/tiga-llvm-22.1.8
          key: llvm-22.1.8-linux-x64-df0e1ecf

      - name: Fetch and verify pinned LLVM SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          curl --fail --location --retry 5 --output "$archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          echo "${LLVM_ARCHIVE_SHA256}  $archive" | sha256sum --check
          mkdir -p "${RUNNER_TOOL_CACHE}/tiga-llvm-${LLVM_VERSION}"
          tar -xJf "$archive" --strip-components=1 \
            -C "${RUNNER_TOOL_CACHE}/tiga-llvm-${LLVM_VERSION}"
          rm -- "$archive"

      - name: Cache LLVM test utilities
        id: test-tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/tiga-llvm-test-tools-22.1.8/bin
            ${{ runner.tool_cache }}/tiga-llvm-test-tools-22.1.8/lit
          key: llvm-test-tools-ubuntu24.04-22.1.8-${{ hashFiles('tools/bootstrap_llvm_test_tools.py') }}

      - name: Prepare LLVM test utilities
        if: steps.test-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sdk="${RUNNER_TOOL_CACHE}/tiga-llvm-${LLVM_VERSION}"
          test_tools="${RUNNER_TOOL_CACHE}/tiga-llvm-test-tools-${LLVM_VERSION}"
          python3 tools/bootstrap_llvm_test_tools.py \
            --llvm-root "$sdk" --output "$test_tools"

      - name: Build wheel and run MLIR regression suite once
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/pip" install --upgrade \
            pip build twine auditwheel mkdocs-material mkdocs-static-i18n
          sdk="${RUNNER_TOOL_CACHE}/tiga-llvm-${LLVM_VERSION}"
          test_tools="${RUNNER_TOOL_CACHE}/tiga-llvm-test-tools-${LLVM_VERSION}"
          # Build the wheel and check-tiga in one native tree, under the same
          # isolated build environment. Only TigaWheel components are packaged.
          CMAKE_ARGS="-DMLIR_DIR=$sdk/lib/cmake/mlir -DLLVM_DIR=$sdk/lib/cmake/llvm -DTIGA_STRICT_LLVM_VERSION=ON" \
            "$RUNNER_TEMP/build-venv/bin/python" -m build --wheel \
              -Cbuild-dir=build/ci \
              -Ccmake.define.TIGA_INCLUDE_TESTS=ON \
              -Ccmake.define.LLVM_EXTERNAL_LIT="$test_tools/lit/lit.py" \
              -Ccmake.define.TIGA_LLVM_TEST_TOOLS_DIR="$test_tools/bin" \
              -Cbuild.targets=all -Cbuild.targets=check-tiga
          "$RUNNER_TEMP/build-venv/bin/python" -m twine check --strict dist/*.whl
          "$RUNNER_TEMP/build-venv/bin/python" -m auditwheel repair \
            --plat manylinux_2_38_x86_64 --wheel-dir wheelhouse dist/*.whl

      - name: Report compilation cache statistics
        if: always()
        run: ccache --show-stats

      - name: Build strict documentation
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" tools/render_api_reference.py --check
          "$RUNNER_TEMP/build-venv/bin/mkdocs" build --strict
          "$RUNNER_TEMP/build-venv/bin/python" tools/check_docs_links.py site

      - name: Smoke-test wheel without Torch or an LLVM installation
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/pip" install --no-deps wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/python" \
            "$GITHUB_WORKSPACE/tests/smoke/wheel_without_torch.py"

      - name: Reclaim native build space before Python tests
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/build/ci" "$GITHUB_WORKSPACE/dist"

      - name: Run Torch-free compiler/runtime tests
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/pip" install \
            pytest numpy pillow matplotlib packaging
          "$RUNNER_TEMP/test-venv/bin/pip" install --no-deps wheelhouse/*.whl
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/test-venv/bin/python" -m pytest -q \
              "$GITHUB_WORKSPACE/tests/python/test_distributed_partitions.py" \
              "$GITHUB_WORKSPACE/tests/python/test_distributed_runtime.py" \
              "$GITHUB_WORKSPACE/tests/python/test_large_graph_suite.py" \
              "$GITHUB_WORKSPACE/tests/python/test_output_layout.py" \
              "$GITHUB_WORKSPACE/tests/python/test_perf_protocol.py" \
              "$GITHUB_WORKSPACE/tests/python/test_plot_benchmarks.py" \
              "$GITHUB_WORKSPACE/tests/python/test_project_boundaries.py" \
              "$GITHUB_WORKSPACE/tests/python/test_provider_registry.py" \
              "$GITHUB_WORKSPACE/tests/python/test_symbolic_shapes.py"

      - uses: actions/upload-artifact@v4
        with:
          name: tiga-linux-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error

  torch-compatibility:
    name: Optional Torch adapter and full CPU suite
    needs: linux-llvm-mlir
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: tiga-linux-wheel
          path: wheelhouse
      - name: Install wheel, tests, and optional CPU Torch adapter
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install pytest numpy pillow matplotlib
          python -m pip install 'torch==2.11.0' \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps wheelhouse/*.whl
      - name: Run installed-wheel CPU Python suite
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          python -m pytest -q "$GITHUB_WORKSPACE/tests/python"
