name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: 22.1.8

jobs:
  quality:
    uses: ./.github/workflows/compiler-ci.yml

  build-wheel:
    # Building can overlap quality checks; publication still requires all gates.
    needs: build-sdist
    name: wheel-${{ matrix.platform }}-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux_2_38_x86_64
            os: ubuntu-24.04
            python: "3.11"
            archive: LLVM-22.1.8-Linux-X64.tar.xz
            sha256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
          - platform: manylinux_2_38_x86_64
            os: ubuntu-24.04
            python: "3.12"
            archive: LLVM-22.1.8-Linux-X64.tar.xz
            sha256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk space for LLVM
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: source-dist

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build xz-utils
          echo "CCACHE_DIR=$RUNNER_TEMP/tiga-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          # Keep pip's extracted sdist under the path normalized by ccache.
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tiga-ccache
          key: release-native-v1-${{ matrix.os }}-llvm22.1.8-py${{ matrix.python }}-${{ github.sha }}
          restore-keys: release-native-v1-${{ matrix.os }}-llvm22.1.8-py${{ matrix.python }}-

      - name: Cache pinned LLVM SDK
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/tiga-llvm-22.1.8
          key: llvm-22.1.8-linux-x64-df0e1ecf

      - name: Fetch pinned LLVM/MLIR SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/${{ matrix.archive }}"
          curl --fail --location --retry 5 --output "$archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${{ matrix.archive }}"
          if command -v sha256sum >/dev/null; then
            echo "${{ matrix.sha256 }}  $archive" | sha256sum --check
          else
            echo "${{ matrix.sha256 }}  $archive" | shasum -a 256 --check
          fi
          mkdir -p "${RUNNER_TOOL_CACHE}/tiga-llvm-${LLVM_VERSION}"
          tar -xJf "$archive" --strip-components=1 \
            -C "${RUNNER_TOOL_CACHE}/tiga-llvm-${LLVM_VERSION}"
          rm -- "$archive"

      - name: Build native wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          sdk="${RUNNER_TOOL_CACHE}/tiga-llvm-${LLVM_VERSION}"
          CMAKE_ARGS="-DMLIR_DIR=$sdk/lib/cmake/mlir -DLLVM_DIR=$sdk/lib/cmake/llvm -DTIGA_STRICT_LLVM_VERSION=ON" \
            python -m pip wheel --no-deps --wheel-dir raw-wheel source-dist/*.tar.gz

      - name: Report compilation cache statistics
        if: always()
        run: ccache --show-stats

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install 'auditwheel>=6'
          python -m auditwheel repair \
            --plat manylinux_2_38_x86_64 \
            --wheel-dir wheelhouse raw-wheel/*.whl

      - name: Repair macOS wheel
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install 'delocate>=0.12'
          python -m delocate.cmd.delocate_wheel \
            --require-archs arm64 --wheel-dir wheelhouse raw-wheel/*.whl

      - name: Smoke test without Torch/LLVM installation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --no-deps wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" \
            "$GITHUB_WORKSPACE/tests/smoke/wheel_without_torch.py"

      - name: Validate repaired wheel metadata
        run: |
          python -m pip install 'twine>=5.1'
          python -m twine check --strict wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-py${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build --sdist --outdir dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
