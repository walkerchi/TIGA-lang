name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (run on a version tag after explicit approval)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  LLVM_VERSION: 22.1.8

jobs:
  quality:
    uses: ./.github/workflows/compiler-ci.yml

  build-wheel:
    needs: [quality, build-sdist]
    name: wheel-${{ matrix.platform }}-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux_2_38_x86_64
            os: ubuntu-24.04
            python: "3.11"
            archive: LLVM-22.1.8-Linux-X64.tar.xz
            sha256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
          - platform: manylinux_2_38_x86_64
            os: ubuntu-24.04
            python: "3.12"
            archive: LLVM-22.1.8-Linux-X64.tar.xz
            sha256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk space for LLVM
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: source-dist

      - name: Fetch pinned LLVM/MLIR SDK
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/${{ matrix.archive }}"
          curl --fail --location --retry 5 --output "$archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${{ matrix.archive }}"
          if command -v sha256sum >/dev/null; then
            echo "${{ matrix.sha256 }}  $archive" | sha256sum --check
          else
            echo "${{ matrix.sha256 }}  $archive" | shasum -a 256 --check
          fi
          mkdir -p "$RUNNER_TEMP/llvm"
          tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/llvm"
          rm -- "$archive"

      - name: Build native wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          sdk="$RUNNER_TEMP/llvm"
          CMAKE_ARGS="-DMLIR_DIR=$sdk/lib/cmake/mlir -DLLVM_DIR=$sdk/lib/cmake/llvm -DTIGA_STRICT_LLVM_VERSION=ON" \
            python -m pip wheel --no-deps --wheel-dir raw-wheel source-dist/*.tar.gz

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install 'auditwheel>=6'
          python -m auditwheel repair \
            --plat manylinux_2_38_x86_64 \
            --wheel-dir wheelhouse raw-wheel/*.whl

      - name: Repair macOS wheel
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install 'delocate>=0.12'
          python -m delocate.cmd.delocate_wheel \
            --require-archs arm64 --wheel-dir wheelhouse raw-wheel/*.whl

      - name: Smoke test without Torch/LLVM installation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --no-deps wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" \
            "$GITHUB_WORKSPACE/tests/smoke/wheel_without_torch.py"

      - name: Validate repaired wheel metadata
        run: |
          python -m pip install 'twine>=5.1'
          python -m twine check --strict wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-py${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build --sdist --outdir dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  gpu-validation:
    needs: build-wheel
    # Configure this trusted runner/environment before the first tag. A
    # missing runner leaves publication blocked, never silently skipped.
    runs-on: [self-hosted, linux, x64, tiga-cuda]
    environment: release-validation
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-manylinux_2_38_x86_64-py3.12
          path: wheelhouse
      - name: Validate the installed release wheel on CUDA
        shell: bash
        run: |
          set -euxo pipefail
          python -m venv "$RUNNER_TEMP/tiga-gpu-release"
          py="$RUNNER_TEMP/tiga-gpu-release/bin/python"
          "$py" -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cu128
          "$py" -m pip install pytest numpy pillow matplotlib 'triton==3.6.0'
          "$py" -m pip install --no-deps wheelhouse/*.whl
          unset PYTHONPATH TIGA_OPT TIGA_TRANSLATE TIGA_RUNTIME_LIBRARY
          "$py" -m tools.gpu_gate

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build-wheel, build-sdist, gpu-validation]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Verify tag matches package version and distributions
        shell: bash
        run: |
          python -m pip install twine packaging
          python tools/verify_release.py dist --tag "$GITHUB_REF_NAME"
          python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
