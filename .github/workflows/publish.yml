name: publish-pypi

# Build in release.yml, validate the downloaded wheel locally, then publish
# those exact artifacts. Never rebuild a wheel after its GPU validation.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful release workflow run for this version tag"
        type: string
        required: true
      gpu_wheel_sha256:
        description: "SHA256 of the CPython 3.12 wheel that passed the local GPU gate"
        type: string
        required: true
      publish_pypi:
        description: "Confirm local GPU validation passed and publish to PyPI"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.publish_pypi && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch source build record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > build-run.json
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          name: sdist
          path: dist
      - name: Verify build provenance, local GPU wheel digest, and metadata
        env:
          GPU_WHEEL_SHA256: ${{ inputs.gpu_wheel_sha256 }}
        run: |
          set -euo pipefail
          python -m pip install twine packaging
          python tools/verify_release_evidence.py dist \
            --run-metadata build-run.json --commit "$(git rev-parse HEAD)" \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --gpu-wheel-sha256 "$GPU_WHEEL_SHA256"
          python tools/verify_release.py dist --tag "$GITHUB_REF_NAME"
          python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
