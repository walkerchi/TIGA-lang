[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tiga-lang"
version = "0.1.1"
description = "A differentiable JIT compiler for graph message-passing programs"
dynamic = ["readme"]
license = "Apache-2.0"
authors = [{ name = "walkerchi", email = "walker.chi.000@gmail.com" }]
maintainers = [{ name = "walkerchi", email = "walker.chi.000@gmail.com" }]
requires-python = ">=3.11,<3.13"
dependencies = []
keywords = ["compiler", "MLIR", "GPU", "sparse", "graph", "scientific-computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/walkerchi/TIGA-lang"
Documentation = "https://walkerchi.github.io/TIGA-lang/"
Repository = "https://github.com/walkerchi/TIGA-lang.git"
Issues = "https://github.com/walkerchi/TIGA-lang/issues"
"Technical report" = "https://github.com/walkerchi/tiga-lang-paper"

[project.optional-dependencies]
# Explicit opt-in only; ordinary installation must not install or upgrade Torch.
torch = ["torch>=2.11,<2.12"]
cuda = ["triton>=3.6,<3.7"]
nccl-cu12 = ["nvidia-nccl-cu12>=2.28"]
benchmarks = ["torch>=2.11,<2.12", "matplotlib>=3.8"]
visualization = ["numpy>=1.24", "Pillow>=10", "matplotlib>=3.8"]
docs = ["mkdocs-material>=9.6", "mkdocs-static-i18n>=1.3"]
test = ["pytest>=8", "numpy>=1.24", "Pillow>=10", "matplotlib>=3.8", "torch>=2.11,<2.12", "lit>=18"]
mpi = ["mpi4py>=4"]
dev = [
  "build>=1.2",
  "matplotlib>=3.8",
  "mkdocs-material>=9.6",
  "mkdocs-static-i18n>=1.3",
  "numpy>=1.24",
  "Pillow>=10",
  "pytest>=8",
  "torch>=2.11,<2.12",
  "triton>=3.6,<3.7",
  "twine>=5.1",
]

# Repository images stay relative on GitHub; package metadata needs public URLs.
[[tool.dynamic-metadata]]
provider = {path = "tools", module = "pypi_readme"}

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["python/tiga"]
wheel.exclude = ["**/__pycache__", "**/*.pyc"]
install.components = ["TigaWheel"]
sdist.inclusion-mode = "explicit"
sdist.include = [
  "pyproject.toml",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "third_party/licenses/**",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "CITATION.cff",
  "SECURITY.md",
  "CMakeLists.txt",
  "cmake/**",
  "include/**",
  "lib/**",
  "tools/**",
  "python/**",
  "python_bindings/**",
  "benchmarks/**",
  "docs/**",
  "overrides/**",
  "examples/**",
  "tests/**",
  "mkdocs.yml",
  ".readthedocs.yaml",
  "README.md",
  "README.zh.md",
  "assets/**",
]
sdist.exclude = [
  "**/__pycache__",
  "**/__pycache__/**",
  "**/*.pyc",
  ".pytest_cache/**",
  "build/**",
  "dist/**",
  "output/**",
  "site/**",
]

[tool.scikit-build.cmake.define]
TIGA_INCLUDE_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
