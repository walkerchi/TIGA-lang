  <rect width="1440" height="820" fill="#f8fafc" />
  <text x="52" y="58" class="title">Topology says what may be read; the operator says the math</text>
  <text x="52" y="88" class="subtitle">The same relation supports constant coefficients, Field-dependent nonlinear fluxes, and joint fixed-neighborhood formulas.</text>

  
