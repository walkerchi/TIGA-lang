<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Tiga separates neighborhood topology from linear and nonlinear operators</title>
  <desc id="desc">A reusable relation feeds either edge-wise message passing with an associative reducer or a fixed-port neighborhood kernel for joint nonlinear computation.</desc>
