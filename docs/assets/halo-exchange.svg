<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Halo exchange before local computation</title>
  <desc id="desc">Owner values flow to ghosts; reverse-mode cotangents return to owners. Complete halo exchange before computing all local rows.</desc>
  <defs>
    <marker id="hArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#4f46e5" />
    </marker>
    <marker id="hArrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#7c3aed" />
    </marker>
    <marker id="hArrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#0f766e" />
    </marker>
    <style>
      text{font-family:Arial,sans-serif}
      .title{font-size:21px;font-weight:700;fill:#0f172a}
      .section{font-size:13px;font-weight:700;fill:#312e81}
      .rank{font-size:13px;font-weight:700;fill:#334155}
      .mono{font-family:Consolas,monospace;font-size:12.5px;fill:#312e81}
      .body{font-size:12.5px;fill:#334155}
      .small{font-size:11.5px;fill:#64748b}
      .barTxt{font-size:12px;font-weight:700;fill:#ffffff}
      .owned{fill:#ffffff;stroke:#4f46e5;stroke-width:2}
      .ghost{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:5 4}
      .nodeLbl{font-size:12.5px;font-weight:700;fill:#312e81}
      .ghostLbl{font-size:12.5px;font-weight:700;fill:#7c3aed}
      .panel{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.4}
      .chain{fill:none;stroke:#cbd5e1;stroke-width:2}
      .read{fill:none;stroke:#4f46e5;stroke-width:2;marker-end:url(#hArrow)}
      .fwd{fill:none;stroke:#7c3aed;stroke-width:2.4;marker-end:url(#hArrowF)}
      .rev{fill:none;stroke:#0f766e;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#hArrowR)}
      .fwdLbl{font-size:12px;font-weight:700;fill:#7c3aed}
      .revLbl{font-size:12px;font-weight:700;fill:#0f766e}
    </style>
  </defs>

  <rect width="1000" height="600" rx="18" fill="#f8fafc" />
  <text x="36" y="42" class="title">Halo exchange — two ranks, one logical ring</text>
  <text x="36" y="72" class="section">partition and ghost map · dashed circles are ghost copies</text>

  
  <rect x="40" y="122" width="440" height="174" rx="14" class="panel" />
  <text x="60" y="148" class="rank">rank 0 · owns rows 0–3</text>
  <path d="M115 178 H150 M180 178 H215 M245 178 H280" class="chain" />
  <path d="M368 172 C 340 150, 322 156, 306 166" class="read" />
  <circle cx="100" cy="178" r="15" class="owned" />
  <text x="100" y="183" text-anchor="middle" class="nodeLbl">0</text>
  <circle cx="165" cy="178" r="15" class="owned" />
  <text x="165" y="183" text-anchor="middle" class="nodeLbl">1</text>
  <circle cx="230" cy="178" r="15" class="owned" />
  <text x="230" y="183" text-anchor="middle" class="nodeLbl">2</text>
  <circle cx="295" cy="178" r="15" class="owned" />
  <text x="295" y="183" text-anchor="middle" class="nodeLbl">3</text>
  <circle cx="380" cy="178" r="15" class="ghost" />
  <text x="380" y="183" text-anchor="middle" class="ghostLbl">4′</text>
  <text x="197" y="222" text-anchor="middle" class="small">owned destinations</text>

  
  <rect x="520" y="122" width="440" height="174" rx="14" class="panel" />
  <text x="940" y="148" text-anchor="end" class="rank">rank 1 · owns rows 4–7</text>
  <path d="M695 178 H730 M760 178 H795 M825 178 H860" class="chain" />
  <path d="M624 172 C 652 150, 670 156, 686 166" class="read" />
  <circle cx="612" cy="178" r="15" class="ghost" />
  <text x="612" y="183" text-anchor="middle" class="ghostLbl">3′</text>
  <circle cx="680" cy="178" r="15" class="owned" />
  <text x="680" y="183" text-anchor="middle" class="nodeLbl">4</text>
  <circle cx="745" cy="178" r="15" class="owned" />
  <text x="745" y="183" text-anchor="middle" class="nodeLbl">5</text>
  <circle cx="810" cy="178" r="15" class="owned" />
  <text x="810" y="183" text-anchor="middle" class="nodeLbl">6</text>
  <circle cx="875" cy="178" r="15" class="owned" />
  <text x="875" y="183" text-anchor="middle" class="nodeLbl">7</text>
  <text x="777" y="222" text-anchor="middle" class="small">owned destinations</text>

  
  <path d="M672 158 C 614 92, 452 92, 392 150" class="fwd" />
  <path d="M308 158 C 370 92, 542 92, 600 150" class="fwd" />
  <text x="500" y="96" text-anchor="middle" class="fwdLbl">forward: owner → ghost — field values (pack → exchange → unpack)</text>

  
  <path d="M392 204 C 460 270, 604 270, 666 206" class="rev" />
  <path d="M600 204 C 540 270, 380 270, 310 206" class="rev" />
  <text x="500" y="290" text-anchor="middle" class="revLbl">adjoint: ghost → owner — cotangents accumulated (+=)</text>

  
  <text x="36" y="336" class="section">One execution policy: communication then compute</text>
  <rect x="150" y="360" width="220" height="34" rx="7" fill="#7c3aed" />
  <text x="260" y="382" text-anchor="middle" class="barTxt">Complete halo exchange</text>
  <path d="M385 377 H445" class="read" />
  <rect x="465" y="360" width="380" height="34" rx="7" fill="#4f46e5" />
  <text x="655" y="382" text-anchor="middle" class="barTxt">Compute all owned destination rows</text>
  <text x="500" y="422" text-anchor="middle" class="small">Ghost values are ready before the local kernel runs. No interior / boundary output merge.</text>
</svg>
