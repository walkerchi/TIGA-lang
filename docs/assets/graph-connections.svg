<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Five directed edges; destination 0 receives from nodes 0 and 2</title>
  <desc id="desc">Three nodes, not two separate node sets. Highlighted edges e0, from 0 to itself, and e1, from 2 to 0, enter destination 0. Muted edges are e2 from 1 to itself, e3 from 0 to 2, and e4 from 1 to 2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#84919f" stroke-width="1.6"/></marker>
    <marker id="focus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#087f76" stroke-width="1.6"/></marker>
  </defs>
  <rect width="640" height="300" rx="10" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="17" fill="#627080">
    <text x="28" y="34" fill="#087f76" font-weight="700">dst 0 ← src 0, src 2</text>
    <g fill="none" stroke="#a0aab7" stroke-width="2" marker-end="url(#arrow)">
      <path d="M179 110 Q312 16 442 110"/>
      <path d="M465 225 L465 157"/>
      <path d="M490 238 C563 186 563 302 489 266"/>
    </g>
    <text x="305" y="73">e3</text><text x="480" y="196">e4</text><text x="553" y="256">e2</text>
    <g fill="none" stroke="#087f76" stroke-width="3" marker-end="url(#focus-arrow)">
      <path d="M435 130 H183"/>
      <path d="M129 112 C51 46 50 205 127 149"/>
    </g>
    <text x="303" y="154" fill="#087f76" font-weight="700">e1</text>
    <text x="61" y="132" fill="#087f76" font-weight="700">e0</text>
    <circle cx="155" cy="130" r="27" fill="#e0f2ee" stroke="#087f76" stroke-width="3"/>
    <circle cx="465" cy="130" r="27" fill="#f8fafc" stroke="#a0aab7" stroke-width="2"/>
    <circle cx="465" cy="252" r="27" fill="#f8fafc" stroke="#a0aab7" stroke-width="2"/>
    <g font-size="23" text-anchor="middle" fill="#243746">
      <text x="155" y="138" font-weight="700">0</text><text x="465" y="138">2</text><text x="465" y="260">1</text>
    </g>
  </g>
</svg>
