<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">GraphForge mesh spectrum</title>
  <desc id="desc">Structured, curvilinear, unstructured, and adaptive meshes all become entity sets, oriented incidence relations, and geometry fields.</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .title { font-family: DejaVu Sans, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: DejaVu Sans, Arial, sans-serif; font-size: 18px; fill: #475569; }
      .heading { font-family: DejaVu Sans, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .small { font-family: DejaVu Sans, Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .label { font-family: DejaVu Sans, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #334155; }
      .mono { font-family: DejaVu Sans Mono, monospace; font-size: 13px; font-weight: 600; fill: #475569; }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .mesh { fill: none; stroke: #64748b; stroke-width: 2.4; }
      .fine { fill: none; stroke: #94a3b8; stroke-width: 1.8; }
      .vertex { fill: #fff; stroke: #334155; stroke-width: 2.5; }
      .face { stroke: #2563eb; stroke-width: 4; }
      .cell { fill: #dcfce7; fill-opacity: .75; stroke: #16a34a; stroke-width: 3; }
      .chip { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .flow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow3); }
    </style>
  </defs>

  <rect width="1440" height="760" fill="#f8fafc"/>
  <text x="52" y="58" class="title">Grid is one mesh provider, not the graph model</text>
  <text x="52" y="88" class="subtitle">Connectivity may be computed, deformed, explicit/ragged, or versioned; kernels still consume typed relations.</text>

  <!-- Structured -->
  <rect x="42" y="118" width="320" height="420" rx="18" class="panel"/>
  <text x="66" y="158" class="heading">Structured</text>
  <text x="66" y="184" class="small">affine endpoint maps</text>
  <path d="M84 230H320M84 290H320M84 350H320M84 410H320M84 470H320 M100 214V486M160 214V486M220 214V486M280 214V486" class="mesh"/>
  <rect x="160" y="290" width="60" height="60" class="cell"/>
  <line x1="220" y1="290" x2="220" y2="350" class="face"/>
  <text x="66" y="510" class="mono">incidence = formula(i,j)</text>

  <!-- Curvilinear -->
  <rect x="388" y="118" width="320" height="420" rx="18" class="panel"/>
  <text x="412" y="158" class="heading">Curvilinear</text>
  <text x="412" y="184" class="small">regular topology, coordinate Fields</text>
  <path d="M430 230C500 200 580 255 666 220 M426 292C500 260 590 320 670 282 M430 356C500 320 585 386 666 348 M426 420C500 380 590 450 670 408 M438 480C510 445 585 505 658 470" class="mesh"/>
  <path d="M450 215C425 290 455 385 438 480 M510 214C480 285 525 398 505 480 M570 225C545 300 595 390 575 486 M630 220C610 300 650 390 640 478" class="mesh"/>
  <path d="M505 278C530 273 558 287 586 303L580 365C550 350 530 343 515 347Z" class="cell"/>
  <text x="412" y="510" class="mono">x = coordinate_field[entity]</text>

  <!-- Unstructured -->
  <rect x="734" y="118" width="320" height="420" rx="18" class="panel"/>
  <text x="758" y="158" class="heading">Unstructured</text>
  <text x="758" y="184" class="small">explicit oriented incidence</text>
  <g class="mesh">
    <path d="M780 245L860 220L940 250L1010 225L995 325L1020 420L925 480L820 455L770 365Z"/>
    <path d="M780 245L855 315L860 220 M855 315L940 250L925 365L820 455 M855 315L770 365 M925 365L995 325L940 250 M925 365L1020 420L925 480 M855 315L925 365"/>
  </g>
  <polygon points="855,315 940,250 925,365" class="cell"/>
  <line x1="855" y1="315" x2="925" y2="365" class="face"/>
  <circle cx="780" cy="245" r="6" class="vertex"/><circle cx="860" cy="220" r="6" class="vertex"/><circle cx="940" cy="250" r="6" class="vertex"/><circle cx="1010" cy="225" r="6" class="vertex"/>
  <circle cx="855" cy="315" r="6" class="vertex"/><circle cx="925" cy="365" r="6" class="vertex"/><circle cx="770" cy="365" r="6" class="vertex"/><circle cx="995" cy="325" r="6" class="vertex"/><circle cx="1020" cy="420" r="6" class="vertex"/><circle cx="925" cy="480" r="6" class="vertex"/><circle cx="820" cy="455" r="6" class="vertex"/>
  <text x="758" y="510" class="mono">cell → faces → vertices</text>

  <!-- Adaptive -->
  <rect x="1080" y="118" width="318" height="420" rx="18" class="panel"/>
  <text x="1104" y="158" class="heading">Adaptive / evolving</text>
  <text x="1104" y="184" class="small">versioned hierarchy and interfaces</text>
  <rect x="1122" y="222" width="232" height="248" class="mesh"/>
  <path d="M1238 222V470 M1122 346H1354" class="mesh"/>
  <path d="M1122 284H1238 M1180 222V346 M1122 253H1180 M1151 222V284 M1180 284H1238 M1209 222V284" class="fine"/>
  <path d="M1238 408H1354 M1296 346V470 M1238 377H1296 M1267 346V408 M1296 408H1354 M1325 346V408" class="fine"/>
  <rect x="1122" y="222" width="29" height="31" class="cell"/>
  <text x="1104" y="510" class="mono">parent/child + coarse/fine</text>

  <!-- Common representation -->
  <rect x="42" y="570" width="1356" height="146" rx="18" class="panel"/>
  <rect x="70" y="610" width="238" height="66" rx="12" class="chip"/>
  <text x="98" y="638" class="label">Mesh provider / importer</text>
  <text x="98" y="661" class="small">grid · file · generator · AMR</text>
  <path d="M318 643H382" class="flow"/>
  <rect x="394" y="598" width="458" height="90" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="420" y="628" class="label">Mesh / Complex</text>
  <text x="420" y="652" class="small">typed EntitySets + oriented Incidence Relations + Geometry Fields</text>
  <text x="420" y="674" class="small">vertices · edges · faces · cells · particles · dofs</text>
  <path d="M862 643H926" class="flow"/>
  <rect x="938" y="610" width="204" height="66" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="970" y="638" class="label">Selected Relation</text>
  <text x="970" y="661" class="small">generated / paged / explicit</text>
  <path d="M1152 643H1216" class="flow"/>
  <rect x="1228" y="610" width="142" height="66" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1258" y="638" class="label">Kernel</text>
  <text x="1248" y="661" class="small">same gf.apply</text>
</svg>
