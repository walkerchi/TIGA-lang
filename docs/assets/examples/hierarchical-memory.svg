<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">The memory hierarchy with per-tier capacity, bandwidth and latency</title>
  <desc id="desc">Four tiers left to right: on-chip SMEM and registers, GPU HBM, host RAM, NVMe SSD. Each tier lists typical capacity, bandwidth and latency. Between RAM and NVMe, two arrows show the GraphForge spill API: .disk() writes a tensor to disk and frees the buffer, .cpu() reads it back.</desc>
  <defs>
    <marker id="mpArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b"/>
    </marker>
    <marker id="gfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#4f46e5"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif}
      .title{font-size:21px;font-weight:700;fill:#0f172a}
      .body{font-size:12.5px;fill:#334155}
      .mono{font-family:Consolas,monospace;font-size:12.5px;fill:#312e81}
      .monoW{font-family:Consolas,monospace;font-size:12.5px;fill:#ffffff}
      .stage{font-size:10.5px;font-weight:700;fill:#64748b;letter-spacing:1.1px}
      .tier{font-size:14px;font-weight:700;fill:#312e81}
      .stat{font-size:12px;fill:#334155}
      .flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#mpArrow)}
      .spill{fill:none;stroke:#4f46e5;stroke-width:2.4;marker-end:url(#gfArrow)}
      .box{fill:#ffffff;stroke:#c7d2fe;stroke-width:1.6}
      .hot{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
    </style>
  </defs>

  <rect width="1000" height="400" rx="18" fill="#f8fafc"/>
  <text x="36" y="44" class="title">The memory hierarchy: bigger and slower per step</text>
  <text x="36" y="70" class="body">typical single-GPU workstation numbers, order of magnitude</text>

  <!-- tier boxes -->
  <g>
    <rect x="36" y="96" width="200" height="150" rx="12" class="box"/>
    <text x="136" y="122" text-anchor="middle" class="tier">SMEM / registers</text>
    <text x="136" y="150" text-anchor="middle" class="stat">~228 KB per SM</text>
    <text x="136" y="172" text-anchor="middle" class="stat">&gt;20 TB/s · ~10 ns</text>
    <text x="136" y="194" text-anchor="middle" class="stat">on-chip only</text>
  </g>
  <path d="M236 171 H258" class="flow"/>

  <g>
    <rect x="262" y="96" width="200" height="150" rx="12" class="box"/>
    <text x="362" y="122" text-anchor="middle" class="tier">GPU HBM</text>
    <text x="362" y="150" text-anchor="middle" class="stat">16–24 GB</text>
    <text x="362" y="172" text-anchor="middle" class="stat">~1 TB/s · ~0.5 µs</text>
    <text x="362" y="194" text-anchor="middle" class="stat">device buffers</text>
  </g>
  <path d="M462 171 H484" class="flow"/>

  <g>
    <rect x="488" y="96" width="200" height="150" rx="12" class="box"/>
    <text x="588" y="122" text-anchor="middle" class="tier">RAM (DDR5)</text>
    <text x="588" y="150" text-anchor="middle" class="stat">64–256 GB</text>
    <text x="588" y="172" text-anchor="middle" class="stat">~100 GB/s · ~100 ns</text>
    <text x="588" y="194" text-anchor="middle" class="stat">host buffers</text>
  </g>

  <g>
    <rect x="714" y="96" width="200" height="150" rx="12" class="hot"/>
    <text x="814" y="122" text-anchor="middle" class="tier">NVMe SSD</text>
    <text x="814" y="150" text-anchor="middle" class="stat">1–4 TB</text>
    <text x="814" y="172" text-anchor="middle" class="stat">~7 GB/s · ~100 µs</text>
    <text x="814" y="194" text-anchor="middle" class="stat">spill files</text>
  </g>

  <!-- the gf-managed RAM <-> NVMe channel -->
  <path d="M648 171 H710" class="spill"/>
  <text x="701" y="158" text-anchor="middle" class="mono">.disk()</text>
  <path d="M710 196 H648" class="spill"/>
  <text x="701" y="216" text-anchor="middle" class="mono">.cpu()</text>

  <!-- bottom annotation -->
  <rect x="488" y="262" width="426" height="96" rx="12" class="hot"/>
  <text x="701" y="288" text-anchor="middle" class="mono">x.disk() · x.cpu() · tg.from_disk(name)</text>
  <text x="701" y="312" text-anchor="middle" class="body">anonymous spill: buffer freed, file deleted when the</text>
  <text x="701" y="330" text-anchor="middle" class="body">tensor is collected or the process exits</text>
  <text x="701" y="350" text-anchor="middle" class="body">named spill: survives, attach from another process</text>

  <text x="36" y="288" class="body">moving one step right trades ~15× bandwidth</text>
  <text x="36" y="308" class="body">for ~4× capacity —</text>
  <text x="36" y="328" class="body">spilling pays when the working set exceeds RAM</text>
  <text x="36" y="356" class="mono">capacity ↑   bandwidth ↓   latency ↑</text>
</svg>
