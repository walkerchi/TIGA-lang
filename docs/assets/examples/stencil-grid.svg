<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="title desc">
  <title id="title">Five-point stencil</title>
  <desc id="desc">Node 12 of a row-major five-by-five grid gathers nodes 7, 11, 13 and 17, together with itself. Only its three-by-three neighborhood is shown.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#746194"/></marker></defs>
  <g stroke="#c6c8d0" stroke-width="1" fill="none"><path d="M152 42H328 M152 130H328 M152 218H328 M152 42V218 M240 42V218 M328 42V218"/></g>
  <g fill="#c6c8d0"><circle cx="152" cy="42" r="4"/><circle cx="328" cy="42" r="4"/><circle cx="152" cy="218" r="4"/><circle cx="328" cy="218" r="4"/></g>
  <g stroke="#746194" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M240 64V102"/><path d="M174 130H212"/><path d="M306 130H268"/><path d="M240 196V158"/></g>
  <g fill="#fff" stroke="#746194" stroke-width="2"><circle cx="240" cy="42" r="20"/><circle cx="152" cy="130" r="20"/><circle cx="328" cy="130" r="20"/><circle cx="240" cy="218" r="20"/></g>
  <circle cx="240" cy="130" r="23" fill="#746194"/>
  <g font-family="Arial,sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central"><g fill="#51416a"><text x="240" y="42">7</text><text x="152" y="130">11</text><text x="328" y="130">13</text><text x="240" y="218">17</text></g><text x="240" y="130" fill="#fff" font-weight="bold">12</text></g>
</svg>
