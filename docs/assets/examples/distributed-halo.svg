<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">8-node ring sharded across two processes</title>
  <desc id="desc">Rank 0 owns nodes 0 to 3 and rank 1 owns nodes 4 to 7 of an 8-node ring. Computing out[3] needs x[4] from rank 1, so the runtime copies it across the boundary as a halo (ghost) value; the reverse pass sends the gradient of x[4] back to its owner.</desc>
  <defs>
    <marker id="mpArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b" />
    </marker>
    <marker id="mpArrowVjp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#7c3aed" />
    </marker>
