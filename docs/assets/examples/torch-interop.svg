<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="940" height="320" viewBox="0 0 940 320" role="img" aria-labelledby="title desc">
  <title id="title">Ring aggregation and zero-copy Torch interop</title>
  <desc id="desc">Eight nodes form a ring; each node sums the values of its two neighbors. Separately, a torch.Tensor and a tg.Tensor can share the same storage without a copy.</desc>
