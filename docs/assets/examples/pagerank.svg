<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">PageRank: rank flows along links, round after round</title>
  <desc id="desc">Four pages with three links forming a cycle among pages 0, 1 and 2, plus page 3 with no outgoing links. Twenty iteration rounds are captured once as a single gf_control.repeat op, producing the final rank vector whose entries sum to one.</desc>
  <defs>
    <marker id="mpArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b" />
    </marker>
    <style>
      text{font-family:Arial,sans-serif}
      .title{font-size:21px;font-weight:700;fill:#0f172a}
      .body{font-size:12.5px;fill:#334155}
      .mono{font-family:Consolas,monospace;font-size:12.5px;fill:#312e81}
      .stage{font-size:10.5px;font-weight:700;fill:#64748b;letter-spacing:1.1px}
      .flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#mpArrow)}
      .box{fill:#ffffff;stroke:#c7d2fe;stroke-width:1.6}
      .userBox{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
      .node{fill:#ffffff;stroke:#4f46e5;stroke-width:2}
      .dangle{fill:#ffffff;stroke:#7c3aed;stroke-width:2}
    </style>
  </defs>

  <rect width="920" height="300" rx="18" fill="#f8fafc" />
  <text x="36" y="44" class="title">PageRank: rank flows along links, round after round</text>

