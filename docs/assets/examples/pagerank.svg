    <path d="M108 165 L92 200" class="flow" />
    <path d="M96 215 H144" class="flow" />
    <path d="M148 200 L132 165" class="flow" />
    <circle cx="120" cy="150" r="16" class="node" />
    <circle cx="80" cy="215" r="16" class="node" />
    <circle cx="160" cy="215" r="16" class="node" />
    <circle cx="286" cy="190" r="16" class="dangle" />
    <text x="120" y="155" text-anchor="middle" class="mono">0</text>
    <text x="80" y="220" text-anchor="middle" class="mono">1</text>
    <text x="160" y="220" text-anchor="middle" class="mono">2</text>
    <text x="286" y="195" text-anchor="middle" class="mono">3</text>
    <text x="286" y="226" text-anchor="middle" class="body">dangling</text>
  </g>
