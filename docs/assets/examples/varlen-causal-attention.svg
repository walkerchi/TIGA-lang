<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc">
  <title id="title">Varlen: edges stop at sequence boundaries</title>
  <desc id="desc">A 5 by 5 attention matrix for cu_seqlens 0, 3, 5: two block-diagonal causal triangles. Positions 0 to 2 attend within sequence 0, positions 3 to 4 within sequence 1, and every cross-sequence cell is absent.</desc>
