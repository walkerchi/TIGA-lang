<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">GraphForge structural compiler speedups</title>
  <desc id="desc">Six independently registered transformations range from 2.337 to 6.318 times their matched peer.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#0f172a}.sub{font:14px Arial,sans-serif;fill:#64748b}
      .label{font:15px Arial,sans-serif;fill:#1e293b}.tick{font:12px Arial,sans-serif;fill:#64748b}
      .value{font:700 14px Arial,sans-serif;fill:#312e81}.tag{font:700 11px Arial,sans-serif;fill:#1d4ed8;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1100" height="620" rx="20" fill="#f8fafc"/>
  <text x="42" y="49" class="title">Structural compiler wins</text>
  <text x="42" y="77" class="sub">Matched semantic boundaries · RTX 5070 Ti unless marked CPU · independent gates, no cross-workload geomean</text>
  <g stroke="#cbd5e1" stroke-width="1"><path d="M365 112v408M480 112v408M595 112v408M710 112v408M825 112v408M940 112v408M1055 112v408"/></g>
  <path d="M365 104v424" stroke="#334155" stroke-width="3"/>
  <g class="tick" text-anchor="middle"><text x="365" y="550">1×</text><text x="480" y="550">2×</text><text x="595" y="550">3×</text><text x="710" y="550">4×</text><text x="825" y="550">5×</text><text x="940" y="550">6×</text><text x="1055" y="550">7×</text></g>
  <g class="label" text-anchor="end">
    <text x="338" y="142">CPU fused relation loop</text><text x="338" y="212">Periodic generated radius</text>
    <text x="338" y="282">Radius build + consume</text><text x="338" y="352">Fixed vector CSR, F16</text>
    <text x="338" y="422">Ragged vector CSR, F16</text><text x="338" y="492">Fused PageRank recurrence</text>
  </g>
  <g fill="url(#bar)">
    <rect x="365" y="119" width="611.6" height="32" rx="7"/><rect x="365" y="189" width="582.4" height="32" rx="7"/>
    <rect x="365" y="259" width="393.9" height="32" rx="7"/><rect x="365" y="329" width="382.0" height="32" rx="7"/>
    <rect x="365" y="399" width="369.5" height="32" rx="7"/><rect x="365" y="469" width="153.8" height="32" rx="7"/>
  </g>
  <g class="value">
    <text x="989" y="141">6.318×</text><text x="960" y="211">up to 6.064×</text><text x="772" y="281">4.425×</text>
    <text x="760" y="351">4.322×</text><text x="748" y="421">4.213×</text><text x="532" y="491">up to 2.337×</text>
  </g>
  <g><rect x="42" y="574" width="139" height="26" rx="13" fill="#dbeafe"/><text x="111" y="592" text-anchor="middle" class="tag">COMPILER-GENERATED</text>
    <text x="197" y="592" class="tick">Parity-only GEMM, exact kNN and mature attention comparisons are reported separately.</text></g>
</svg>
