<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">GraphForge compiler architecture from Python programs to serialized TTIR</title>
  <desc id="desc">Graph and tensor programs are captured into semantic IR, optimized into iteration and kernel IR, combined with storage and distributed task plans, and translated through the GPU provider into serialized TTIR. CPU lowering is a sibling path through MLIR and LLVM.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ttir" x1="0" x2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#4f46e5"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#0f172a}.subtitle{font-size:15px;fill:#64748b}
      .stage{font-size:12px;font-weight:700;fill:#64748b;letter-spacing:1.4px}.boxTitle{font-size:18px;font-weight:700;fill:#0f172a}
      .body{font-size:13px;fill:#334155}.small{font-size:11px;fill:#64748b}.mono{font-family:Consolas,monospace;font-size:14px;font-weight:700;fill:#312e81}
      .whiteTitle{font-size:21px;font-weight:700;fill:#fff}.whiteBody{font-size:13px;fill:#ede9fe}.badge{font-size:11px;font-weight:700;letter-spacing:.45px}
      .flow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.flowBlue{fill:none;stroke:#4f46e5;stroke-width:3;marker-end:url(#arrowBlue)}
      .planFlow{fill:none;stroke:#0f766e;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1440" height="900" rx="24" fill="#f8fafc"/>
  <rect x="34" y="28" width="1372" height="78" rx="17" fill="#4338ca"/>
  <text x="68" y="63" class="whiteTitle">GraphForge compiler architecture</text>
  <text x="68" y="88" class="whiteBody">Python relation/tensor programs → semantic IR → physical iteration and execution plan → inspectable provider output</text>

  <g class="stage">
    <text x="50" y="145">1 · PROGRAM + JIT</text>
    <text x="345" y="145">2 · SEMANTIC IR</text>
    <text x="650" y="145">3 · PHYSICAL LOWERING</text>
    <text x="955" y="145">4 · EXECUTION PLAN</text>
    <text x="1220" y="145">5 · OUTPUT</text>
  </g>

  <!-- User surface -->
  <g filter="url(#shadow)">
    <rect x="40" y="165" width="250" height="310" rx="16" fill="#fff" stroke="#cbd5e1"/>
  </g>
  <text x="62" y="198" class="boxTitle">Python surface</text>
  <rect x="62" y="218" width="206" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="78" y="242" class="mono">gf.Tensor</text><text x="78" y="262" class="small">view · broadcast · scan · contract</text>
  <rect x="62" y="286" width="206" height="73" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="78" y="310" class="mono">gf.Graph</text><text x="78" y="330" class="small">CSR · dense · radius · stencil</text><text x="78" y="348" class="small">generated · partitioned · paged</text>
  <rect x="62" y="371" width="206" height="78" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="78" y="395" class="mono">MessagePassing UDF</text><text x="78" y="415" class="small">edge / node regions</text><text x="78" y="433" class="small">built-in or user Reducer kernel</text>

  <rect x="40" y="497" width="250" height="78" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="525" class="boxTitle">Lazy guarded JIT</text>
  <text x="60" y="548" class="body">capture · specialize · cache · inspect</text>
  <text x="60" y="566" class="small">The ordinary call is the compile boundary.</text>

  <!-- Semantic IR -->
  <g filter="url(#shadow)"><rect x="335" y="165" width="260" height="410" rx="16" fill="#fff" stroke="#cbd5e1"/></g>
  <text x="357" y="198" class="boxTitle">Meaning stays explicit</text>
  <rect x="357" y="218" width="216" height="92" rx="11" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="374" y="245" class="mono">gf.domain</text>
  <text x="374" y="267" class="body">relation + field roles</text><text x="374" y="287" class="body">message regions + reducer</text>
  <rect x="357" y="323" width="216" height="92" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="374" y="350" class="mono">gf.tensor</text>
  <text x="374" y="372" class="body">shape + dtype + broadcasting</text><text x="374" y="392" class="body">map · reduce · scan · contract · VJP</text>
  <rect x="357" y="428" width="216" height="74" rx="11" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="374" y="455" class="mono">gf.control</text>
  <text x="374" y="477" class="body">program composition + effects</text>
  <text x="357" y="530" class="small">verify · canonicalize · provenance</text>
  <text x="357" y="550" class="small">fusion · automatic VJP · legality</text>

  <!-- Physical lowering -->
  <g filter="url(#shadow)"><rect x="640" y="165" width="260" height="410" rx="16" fill="#fff" stroke="#cbd5e1"/></g>
  <text x="662" y="198" class="boxTitle">Choose the physical form</text>
  <rect x="662" y="218" width="216" height="111" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="679" y="245" class="mono">gf.iter</text>
  <text x="679" y="267" class="body">coordinate hierarchy + order</text>
  <text x="679" y="287" class="body">dense / sparse / ragged traversal</text>
  <text x="679" y="307" class="body">materialized / generated relation</text>
  <rect x="662" y="342" width="216" height="91" rx="11" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="679" y="369" class="boxTitle">Schedule selection</text>
  <text x="679" y="391" class="body">tiles · masks · degree buckets</text>
  <text x="679" y="411" class="body">split rows · load balance · fusion</text>
  <rect x="662" y="446" width="216" height="100" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="679" y="473" class="mono">gf.kernel</text>
  <text x="679" y="495" class="body">target-neutral launch + tile</text>
  <text x="679" y="515" class="body">working set + local reduction</text>
  <text x="679" y="535" class="body">no vendor layout encoding</text>

  <!-- Execution planning -->
  <g filter="url(#shadow)"><rect x="945" y="165" width="230" height="410" rx="16" fill="#fff" stroke="#cbd5e1"/></g>
  <text x="967" y="198" class="boxTitle">Plan data + tasks</text>
  <rect x="967" y="218" width="186" height="126" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="984" y="245" class="mono">gf.storage</text>
  <text x="984" y="267" class="body">logical Region</text><text x="984" y="287" class="body">PhysicalInstance + version</text>
  <text x="984" y="307" class="small">register / shared / HBM</text><text x="984" y="325" class="small">RAM / NVMe / distributed</text>
  <rect x="967" y="357" width="186" height="130" rx="11" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="984" y="384" class="mono">gf.task</text>
  <text x="984" y="406" class="body">partition + owned / ghost</text><text x="984" y="426" class="body">halo pack / exchange / unpack</text>
  <text x="984" y="446" class="body">Event DAG + lifetimes</text><text x="984" y="466" class="body">communication ↔ compute</text>
  <rect x="967" y="500" width="186" height="46" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1060" y="528" text-anchor="middle" class="badge" fill="#047857">LOCAL COMPUTE TASKS</text>

  <!-- Output -->
  <g filter="url(#shadow)"><rect x="1210" y="165" width="190" height="410" rx="16" fill="#fff" stroke="#cbd5e1"/></g>
  <text x="1232" y="198" class="boxTitle">Provider lowering</text>
  <rect x="1232" y="218" width="146" height="62" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="1305" y="243" text-anchor="middle" class="mono">GPU provider</text><text x="1305" y="264" text-anchor="middle" class="small">translate + validate</text>
  <rect x="1222" y="302" width="166" height="112" rx="14" fill="#5b3fd1"/>
  <text x="1305" y="337" text-anchor="middle" class="whiteTitle">Serialized TTIR</text>
  <text x="1305" y="361" text-anchor="middle" class="whiteBody">stable GPU handoff</text>
  <text x="1305" y="383" text-anchor="middle" class="whiteBody">inspectable + cacheable</text>
  <text x="1305" y="402" text-anchor="middle" class="whiteBody">provider-neutral boundary</text>
  <rect x="1232" y="439" width="146" height="80" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1305" y="465" text-anchor="middle" class="mono">CPU provider</text>
  <text x="1305" y="487" text-anchor="middle" class="small">vector / scf / memref</text>
  <text x="1305" y="506" text-anchor="middle" class="small">→ LLVM IR</text>
  <text x="1218" y="551" class="small">GPU and CPU are sibling paths.</text>

  <!-- Main arrows -->
  <path d="M290 370H327" class="flowBlue"/>
  <path d="M595 370H632" class="flowBlue"/>
  <path d="M900 370H937" class="flowBlue"/>
  <path d="M1175 370H1202" class="flowBlue"/>
  <path d="M1305 280V294" class="flowBlue"/>
  <path d="M1305 414V431" class="flow"/>
  <path d="M290 536H315V190H327" class="flow"/>

  <!-- Planning feedback -->
  <path d="M760 575V610H1060V554" class="planFlow"/>
  <path d="M1060 575V624H770V583" class="planFlow"/>
  <text x="915" y="650" text-anchor="middle" class="small">cost model feeds placement, overlap and launch decisions back into lowering</text>

  <!-- Stable boundary and downstream -->
  <line x1="40" y1="690" x2="1400" y2="690" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="52" y="677" width="227" height="27" rx="13" fill="#e0e7ff"/>
  <text x="165" y="695" text-anchor="middle" class="badge" fill="#4338ca">GRAPHFORGE STABLE IR BOUNDARY</text>

  <text x="50" y="742" class="stage">DOWNSTREAM TOOLCHAINS</text>
  <rect x="50" y="762" width="835" height="82" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="76" y="795" class="mono">serialized TTIR</text><text x="223" y="795" class="body">→ vendor Triton → TTGIR → LLVM IR → PTX / cubin / vendor ISA</text>
  <text x="76" y="820" class="small">A provider may be NVIDIA, ROCm or a vendor Triton fork; GraphForge does not link their MLIR revisions into its core.</text>
  <rect x="914" y="762" width="476" height="82" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="940" y="795" class="mono">CPU MLIR</text><text x="1038" y="795" class="body">→ LLVM → native assembly</text>
  <text x="940" y="820" class="small">The runtime launches compiled tasks and honors Event DAG dependencies.</text>

  <g>
    <rect x="50" y="862" width="126" height="24" rx="12" fill="#dbeafe"/><text x="113" y="879" text-anchor="middle" class="badge" fill="#1d4ed8">INSPECTABLE IR</text>
    <rect x="187" y="862" width="128" height="24" rx="12" fill="#ede9fe"/><text x="251" y="879" text-anchor="middle" class="badge" fill="#6d28d9">AUTOMATIC VJP</text>
    <rect x="326" y="862" width="164" height="24" rx="12" fill="#d1fae5"/><text x="408" y="879" text-anchor="middle" class="badge" fill="#047857">DISTRIBUTED + HALO</text>
    <rect x="501" y="862" width="176" height="24" rx="12" fill="#ffedd5"/><text x="589" y="879" text-anchor="middle" class="badge" fill="#c2410c">HIERARCHICAL MEMORY</text>
    <text x="700" y="879" class="small">GraphForge preserves these decisions as IR and pass output, not Python-side scheduling hints.</text>
  </g>
</svg>
