<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">GraphForge compiler pipeline: four IR stages and the provider handoff</title>
  <desc id="desc">A Python program is captured into Domain IR, lowered through Iter IR and Kernel IR, planned as Task IR, and finally handed to a provider: serialized TTIR on GPU, MLIR to LLVM on CPU.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#4f46e5" />
    </marker>
    <style>
      text{font-family:Arial,sans-serif}
      .dialect{font-family:Consolas,monospace;font-size:15px;font-weight:700;fill:#4f46e5}
      .gloss{font-size:14px;font-weight:700;fill:#0f172a}
      .items{font-size:12px;fill:#64748b}
      .entryTitle{font-size:15px;font-weight:700;fill:#0f172a}
      .whiteTitle{font-size:19px;font-weight:700;fill:#ffffff}
      .whiteBody{font-size:14px;fill:#e0e7ff}
      .flow{fill:none;stroke:#4f46e5;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="750" fill="#f8fafc" />

  <!-- entry -->
  <rect x="45" y="210" width="180" height="140" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="135" y="262" text-anchor="middle" class="entryTitle">Python program</text>
  <text x="135" y="292" text-anchor="middle" class="items">lazy guarded JIT</text>
  <text x="135" y="314" text-anchor="middle" class="items">capture · specialize · cache</text>

  <!-- Domain IR -->
  <rect x="278" y="210" width="180" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="368" y="250" text-anchor="middle" class="dialect">gf.domain</text>
  <text x="368" y="278" text-anchor="middle" class="gloss">what it means</text>
  <text x="368" y="308" text-anchor="middle" class="items">relations · UDF regions</text>
  <text x="368" y="328" text-anchor="middle" class="items">reducers · effects</text>

  <!-- Iter IR -->
  <rect x="510" y="210" width="180" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="600" y="250" text-anchor="middle" class="dialect">gf.iter</text>
  <text x="600" y="278" text-anchor="middle" class="gloss">how to traverse</text>
  <text x="600" y="308" text-anchor="middle" class="items">dense · sparse · ragged</text>
  <text x="600" y="328" text-anchor="middle" class="items">generated</text>

  <!-- Kernel IR -->
  <rect x="743" y="210" width="180" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="833" y="250" text-anchor="middle" class="dialect">gf.kernel</text>
  <text x="833" y="278" text-anchor="middle" class="gloss">how to launch</text>
  <text x="833" y="308" text-anchor="middle" class="items">tiles · masks</text>
  <text x="833" y="328" text-anchor="middle" class="items">local working set</text>

  <!-- Task IR -->
  <rect x="975" y="210" width="180" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="1065" y="246" text-anchor="middle" class="dialect">gf.task</text>
  <text x="1065" y="266" text-anchor="middle" class="dialect" style="font-size:12px">+ gf.storage</text>
  <text x="1065" y="292" text-anchor="middle" class="gloss">where data lives</text>
  <text x="1065" y="318" text-anchor="middle" class="items">memory · halo · events</text>

  <!-- row arrows -->
  <path d="M225 280H270" class="flow" />
  <path d="M458 280H502" class="flow" />
  <path d="M690 280H735" class="flow" />
  <path d="M923 280H967" class="flow" />

  <!-- down to provider handoff -->
  <path d="M600 350V450" class="flow" />

  <!-- provider handoff: the single accent element -->
  <rect x="320" y="460" width="560" height="140" rx="14" fill="#4f46e5" />
  <text x="600" y="512" text-anchor="middle" class="whiteTitle">Provider handoff</text>
  <text x="600" y="544" text-anchor="middle" class="whiteBody">GPU → serialized TTIR   ·   CPU → MLIR → LLVM</text>
  <text x="600" y="572" text-anchor="middle" class="whiteBody">one stable, inspectable, cacheable boundary</text>
</svg>
