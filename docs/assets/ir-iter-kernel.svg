<svg xmlns="http://www.w3.org/2000/svg" width="760" height="254" viewBox="0 0 760 254" role="img" aria-labelledby="title desc">
<title id="title">Iter orders rows; Kernel groups work</title><desc id="desc">Compressed-row traversal visits neighbors by destination. A Kernel tile covers up to sixteen rows and sixteen neighbor slots per row. Unused slots are masked. The small grid is schematic.</desc>
