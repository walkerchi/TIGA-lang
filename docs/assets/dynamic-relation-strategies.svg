<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic graph relation realization strategies</title>
  <desc id="desc">A logical dynamic relation is lowered to implicit tiles, generated spatial traversal, incremental snapshots, ranked selection, or paged distributed execution.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#fff}.sub{font:14px Arial,sans-serif;fill:#c7d2fe}
      .cardTitle{font:700 17px Arial,sans-serif;fill:#0f172a}.body{font:13px Arial,sans-serif;fill:#475569}
      .status{font:700 11px Arial,sans-serif;letter-spacing:.6px}.chip{font:12px Arial,sans-serif;fill:#334155}
      .flow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <rect x="20" y="20" width="1160" height="104" rx="18" fill="url(#header)"/>
  <text x="54" y="65" class="title">One logical relation, several physical realizations</text>
  <text x="54" y="94" class="sub">Lifecycle + density + residency proofs select the structure; user MessagePassing code stays unchanged.</text>

  <rect x="405" y="151" width="390" height="76" rx="16" fill="#fff" stroke="#818cf8" stroke-width="2"/>
  <text x="600" y="181" text-anchor="middle" class="cardTitle">Captured dynamic relation</text>
  <text x="600" y="204" text-anchor="middle" class="body">metric · predicate · snapshot · placement · reducer</text>

  <path d="M600 227V256H124V278" class="flow"/><path d="M600 256H362V278" class="flow"/>
  <path d="M600 256V278" class="flow"/><path d="M600 256H838V278" class="flow"/>
  <path d="M600 256H1076V278" class="flow"/>

  <g>
    <rect x="34" y="278" width="180" height="224" rx="16" fill="#fff" stroke="#22c55e" stroke-width="2"/>
    <text x="52" y="310" class="cardTitle">Implicit tiles</text><text x="196" y="309" text-anchor="end" class="status" fill="#15803d">READY</text>
    <rect x="54" y="335" width="140" height="64" rx="10" fill="#ecfdf5"/>
    <path d="M66 349h116M66 365h116M66 381h116M84 341v50M112 341v50M140 341v50M168 341v50" stroke="#16a34a" stroke-width="1.5"/>
    <text x="52" y="426" class="body">Dense / triangular</text><text x="52" y="447" class="body">No edge storage</text><text x="52" y="468" class="body">Online reduction</text>
  </g>
  <g>
    <rect x="272" y="278" width="180" height="224" rx="16" fill="#fff" stroke="#22c55e" stroke-width="2"/>
    <text x="290" y="310" class="cardTitle">Spatial generate</text><text x="434" y="309" text-anchor="end" class="status" fill="#15803d">READY</text>
    <rect x="292" y="335" width="140" height="64" rx="10" fill="#ecfdf5"/>
    <path d="M327 335v64M362 335v64M397 335v64M292 367h140" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="314" cy="352" r="5" fill="#2563eb"/><circle cx="347" cy="383" r="5" fill="#7c3aed"/><circle cx="383" cy="350" r="5" fill="#ea580c"/><circle cx="415" cy="381" r="5" fill="#0891b2"/>
    <text x="290" y="426" class="body">Radius / cell list</text><text x="290" y="447" class="body">Generate in consumer</text><text x="290" y="468" class="body">Fuse build + message</text>
  </g>
  <g>
    <rect x="510" y="278" width="180" height="224" rx="16" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="528" y="310" class="cardTitle">Incremental</text><text x="672" y="309" text-anchor="end" class="status" fill="#b45309">NEXT</text>
    <rect x="530" y="335" width="140" height="64" rx="10" fill="#fffbeb"/>
    <circle cx="552" cy="367" r="7" fill="#2563eb"/><circle cx="600" cy="352" r="7" fill="#7c3aed"/><circle cx="648" cy="378" r="7" fill="#ea580c"/>
    <path d="M559 364L592 355M607 356L641 374" stroke="#f59e0b" stroke-width="3"/><path d="M553 346l7-8M649 357l8-9" stroke="#ef4444" stroke-width="2"/>
    <text x="528" y="426" class="body">Verlet / delta CSR</text><text x="528" y="447" class="body">Versioned validity</text><text x="528" y="468" class="body">Async repair/compact</text>
  </g>
  <g>
    <rect x="748" y="278" width="180" height="224" rx="16" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="766" y="310" class="cardTitle">Ranked select</text><text x="910" y="309" text-anchor="end" class="status" fill="#b45309">NEXT</text>
    <rect x="768" y="335" width="140" height="64" rx="10" fill="#fffbeb"/>
    <path d="M783 386h18l9-38 14 38 10-24 12 24h47" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="810" cy="348" r="5" fill="#ef4444"/><circle cx="834" cy="362" r="5" fill="#ef4444"/>
    <text x="766" y="426" class="body">Exact / approximate kNN</text><text x="766" y="447" class="body">Local top-k + merge</text><text x="766" y="468" class="body">Fuse selected consume</text>
  </g>
  <g>
    <rect x="986" y="278" width="180" height="224" rx="16" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
    <text x="1004" y="310" class="cardTitle">Paged + halo</text><text x="1148" y="309" text-anchor="end" class="status" fill="#1d4ed8">PARTIAL</text>
    <rect x="1006" y="335" width="140" height="64" rx="10" fill="#eff6ff"/>
    <rect x="1018" y="348" width="32" height="38" rx="4" fill="#2563eb"/><rect x="1060" y="348" width="32" height="38" rx="4" fill="#7c3aed"/><rect x="1102" y="348" width="32" height="38" rx="4" fill="#0891b2"/>
    <path d="M1051 367h8M1093 367h8" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1004" y="426" class="body">SSD / distributed</text><text x="1004" y="447" class="body">Prefetch + interior</text><text x="1004" y="468" class="body">Exchange + boundary</text>
  </g>

  <rect x="82" y="554" width="1036" height="118" rx="18" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="108" y="586" class="cardTitle">Shared compiler machinery</text>
  <g>
    <rect x="108" y="607" width="190" height="38" rx="19" fill="#fff"/><text x="203" y="631" text-anchor="middle" class="chip">build–consume fusion</text>
    <rect x="320" y="607" width="190" height="38" rx="19" fill="#fff"/><text x="415" y="631" text-anchor="middle" class="chip">degree bucket + split</text>
    <rect x="532" y="607" width="190" height="38" rx="19" fill="#fff"/><text x="627" y="631" text-anchor="middle" class="chip">cache + invalidation proof</text>
    <rect x="744" y="607" width="190" height="38" rx="19" fill="#fff"/><text x="839" y="631" text-anchor="middle" class="chip">memory-budgeted pipeline</text>
    <rect x="956" y="607" width="136" height="38" rx="19" fill="#fff"/><text x="1024" y="631" text-anchor="middle" class="chip">async overlap</text>
  </g>
</svg>
