<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic graph relation realization strategies</title>
  <desc id="desc">One captured dynamic relation is lowered to implicit tiles, generated spatial traversal, incremental snapshots, ranked selection, or paged distributed execution. Implicit tiles and spatial generate are executable today; incremental and ranked select are next; paged halo is partial.</desc>
  <defs>
    <marker id="drsA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b" />
    </marker>
    <style>
      text{font-family:Arial,sans-serif}
      .rootTitle{font-size:17px;font-weight:700;fill:#312e81}
      .cardTitle{font-size:15px;font-weight:700;fill:#0f172a}
      .status{font-size:11px;font-weight:700;letter-spacing:.8px}
      .ready{fill:#4f46e5}
      .pending{fill:#94a3b8}
      .body{font-size:12.5px;fill:#64748b}
      .flow{stroke:#64748b;stroke-width:1.8;fill:none}
    </style>
  </defs>

  <!-- the one logical relation -->
  <rect x="420" y="32" width="360" height="72" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text class="rootTitle" x="600" y="62" text-anchor="middle">Captured dynamic relation</text>
  <text class="body" x="600" y="86" text-anchor="middle">metric · predicate · snapshot · placement · reducer</text>

  <path class="flow" d="M600 104V126"/>
  <path class="flow" d="M140 126H1060"/>
  <path class="flow" d="M140 126V146" marker-end="url(#drsA)"/>
  <path class="flow" d="M370 126V146" marker-end="url(#drsA)"/>
  <path class="flow" d="M600 126V146" marker-end="url(#drsA)"/>
  <path class="flow" d="M830 126V146" marker-end="url(#drsA)"/>
  <path class="flow" d="M1060 126V146" marker-end="url(#drsA)"/>

  <!-- executable today: indigo border carries the emphasis -->
  <rect x="40" y="150" width="200" height="140" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text class="cardTitle" x="62" y="184">Implicit tiles</text>
  <text class="status ready" x="62" y="206">READY</text>
  <text class="body" x="62" y="240">dense / triangular</text>
  <text class="body" x="62" y="262">no edge storage</text>

  <rect x="270" y="150" width="200" height="140" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text class="cardTitle" x="292" y="184">Spatial generate</text>
  <text class="status ready" x="292" y="206">READY</text>
  <text class="body" x="292" y="240">radius / cell list</text>
  <text class="body" x="292" y="262">generate in consumer</text>

  <rect x="500" y="150" width="200" height="140" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="cardTitle" x="522" y="184">Incremental</text>
  <text class="status pending" x="522" y="206">NEXT</text>
  <text class="body" x="522" y="240">Verlet / delta CSR</text>
  <text class="body" x="522" y="262">versioned validity</text>

  <rect x="730" y="150" width="200" height="140" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="cardTitle" x="752" y="184">Ranked select</text>
  <text class="status pending" x="752" y="206">NEXT</text>
  <text class="body" x="752" y="240">exact / approx kNN</text>
  <text class="body" x="752" y="262">local top-k + merge</text>

  <rect x="960" y="150" width="200" height="140" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="cardTitle" x="982" y="184">Paged + halo</text>
  <text class="status pending" x="982" y="206">PARTIAL</text>
  <text class="body" x="982" y="240">SSD / distributed</text>
  <text class="body" x="982" y="262">prefetch + overlap</text>
</svg>
